<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e7ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>

  <!-- Inner subtle ring -->
  <rect x="32" y="32" width="448" height="448" rx="92" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- Key icon -->
  <g transform="translate(256,256) scale(1.8)" filter="url(#glow)">
    <!-- Key head (circle) -->
    <circle cx="-12" cy="-12" r="22" fill="none" stroke="url(#keyGrad)" stroke-width="6"/>
    <circle cx="-12" cy="-12" r="8" fill="url(#keyGrad)"/>

    <!-- Key shaft -->
    <line x1="10" y1="10" x2="56" y2="56" stroke="url(#keyGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Key teeth -->
    <line x1="40" y1="40" x2="40" y2="52" stroke="url(#keyGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="52" y1="52" x2="52" y2="40" stroke="url(#keyGrad)" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
